<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>膨胀小队</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>

        <!-- ===== 顶部HUD ===== -->
        <div id="hud" class="hidden">
            <!-- 顶栏: 头像 | 进度 | 暂停 -->
            <div id="top-bar">
                <div id="avatar-box">
                    <img src="assets/art-v1/ui/soldier-avatar.svg" alt="士兵" draggable="false">
                    <div id="level-badge">Lv.1</div>
                </div>
                <div id="progress-area">
                    <div id="level-name">第 1 关</div>
                    <div id="progress-bar-container">
                        <div id="progress-bar-fill"></div>
                        <div id="progress-nodes"></div>
                        <div id="progress-flag"><div class="flag-pole"></div><div class="flag-cloth"></div></div>
                    </div>
                </div>
                <button id="btn-pause" aria-label="暂停">
                    <span class="pause-bar"></span>
                    <span class="pause-bar"></span>
                </button>
            </div>

            <!-- 属性面板(左侧胶囊) -->
            <div id="stats-panel">
                <div class="stat-row" id="stat-row-count">
                    <svg class="stat-icon" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4" fill="#75DFFF"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8" fill="#75DFFF"/></svg>
                    <span class="stat-label">人数</span>
                    <span class="stat-val" id="stat-count">1</span>
                </div>
                <div class="stat-row" id="stat-row-damage">
                    <svg class="stat-icon" viewBox="0 0 24 24"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z" fill="#FFE66D"/></svg>
                    <span class="stat-label">输出</span>
                    <span class="stat-val" id="stat-damage">1</span>
                </div>
                <div class="stat-row" id="stat-row-firerate">
                    <svg class="stat-icon" viewBox="0 0 24 24"><path d="M3 12h4l2-7 4 14 2-7h6" stroke="#66D68F" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <span class="stat-label">射速</span>
                    <span class="stat-val" id="stat-firerate">2.2</span>
                </div>
            </div>

            <!-- 人数气泡 -->
            <div id="squad-count-badge">
                <svg class="person-icon" viewBox="0 0 24 24"><circle cx="12" cy="6" r="4" fill="white"/><path d="M4 22c0-4.4 3.6-8 8-8s8 3.6 8 8" fill="white"/></svg>
                <span id="squad-count-num">1</span>
            </div>

            <!-- V3.3: 连杀HUD -->
            <div id="combo-box" class="hidden">
                <span id="combo-num">0</span><span class="combo-label">连杀</span>
            </div>

            <!-- V3.4: 广告刷门按钮(有未触发门且次数>0时显示) -->
            <button id="btn-refresh-gates" class="hidden" aria-label="广告刷新状态门">
                <span class="rg-icon">⟳</span>
                <span class="rg-count" id="rg-count">2</span>
            </button>
        </div>

        <!-- Boss血条 -->
        <div id="boss-bar-container" class="hidden">
            <div id="boss-head"><img src="assets/art-v1/ui/zombie-avatar.svg" alt="boss"></div>
            <div id="boss-info">
                <div id="boss-name">BOSS</div>
                <div id="boss-bar-bg">
                    <div id="boss-bar-fill"></div>
                </div>
            </div>
        </div>

        <!-- ===== 暂停菜单 ===== -->
        <div id="pause-screen" class="hidden">
            <div class="title-panel">
                <h2 class="pause-title">暂停</h2>
                <button id="btn-resume" class="btn-primary">继续游戏</button>
                <button id="btn-sound-toggle" class="btn-secondary">🔊 音效: 开</button>
                <button id="btn-pause-restart" class="btn-secondary">重新开始</button>
                <button id="btn-pause-menu" class="btn-secondary">返回主菜单</button>
            </div>
        </div>

        <!-- ===== 开始界面 ===== -->
        <div id="start-screen">
            <div class="title-panel">
                <div class="logo-badge">
                    <img src="assets/art-v1/ui/soldier-avatar.svg" alt="膨胀小队" draggable="false">
                </div>
                <h1 class="game-title">膨胀小队</h1>
                <p class="game-subtitle">招兵买马 · 火力全开</p>
                <button id="btn-start" class="btn-primary">开始游戏</button>
                <div id="level-select" aria-label="关卡选择"></div>
                <p class="hint-text">左右拖动切换跑道</p>
            </div>
        </div>

        <!-- ===== 胜利界面 ===== -->
        <div id="win-screen" class="hidden">
            <div class="title-panel">
                <h1 class="result-title win">胜利!</h1>
                <div id="stars-row">
                    <span class="star filled"></span>
                    <span class="star filled"></span>
                    <span class="star filled"></span>
                </div>
                <div id="win-stats">
                    <div class="win-stat"><span class="ws-label">剩余人数</span><span class="ws-val" id="win-count">0</span></div>
                    <div class="win-stat"><span class="ws-label">击杀数量</span><span class="ws-val" id="win-kills">0</span></div>
                    <div class="win-stat"><span class="ws-label">最大连杀</span><span class="ws-val" id="win-combo">0</span></div>
                    <div class="win-stat"><span class="ws-label">通关时间</span><span class="ws-val" id="win-time">0s</span></div>
                </div>
                <button id="btn-next-level" class="btn-primary">下一关 →</button>
                <button id="btn-double-reward" class="btn-gold">📺 双倍奖励</button>
                <button id="btn-restart-win" class="btn-secondary">再来一次</button>
            </div>
        </div>

        <!-- ===== 失败界面 ===== -->
        <div id="lose-screen" class="hidden">
            <div class="title-panel">
                <h1 class="result-title lose">失败</h1>
                <p class="result-subtitle" id="lose-reason">小队全灭，再接再厉</p>
                <div id="lose-stats">
                    <div class="win-stat"><span class="ws-label">击杀数量</span><span class="ws-val" id="lose-kills">0</span></div>
                    <div class="win-stat"><span class="ws-label">最大连杀</span><span class="ws-val" id="lose-combo">0</span></div>
                </div>
                <button id="btn-restart-lose" class="btn-primary">重新挑战</button>
                <button id="btn-revive" class="btn-ad">📺 观看广告复活</button>
            </div>
        </div>
    </div>

    <script>
        // 全局错误捕获: 将JS错误显示在页面上便于诊断
        window.addEventListener('error', function(e) {
            var div = document.getElementById('error-display');
            if (!div) {
                div = document.createElement('div');
                div.id = 'error-display';
                div.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#CC0000;color:#fff;padding:8px 12px;font-size:13px;font-family:monospace;white-space:pre-wrap;pointer-events:none;';
                document.body.appendChild(div);
            }
            div.textContent += (div.textContent ? '\n' : '') + '[错误] ' + e.message + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '');
        });
    </script>
    <!-- V3.3: Three.js本地副本优先(抖音小游戏必需), CDN兜底 -->
    <script src="js/vendor/three.min.js"></script>
    <script>
        // 本地加载失败时回退CDN
        if (typeof THREE === 'undefined') {
            document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"><\/script>');
        }
        // 检测Three.js是否加载成功
        if (typeof THREE === 'undefined') {
            document.addEventListener('DOMContentLoaded', function() {
                var div = document.getElementById('error-display');
                if (!div) {
                    div = document.createElement('div');
                    div.id = 'error-display';
                    div.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#CC0000;color:#fff;padding:8px 12px;font-size:13px;font-family:monospace;white-space:pre-wrap;pointer-events:none;';
                    document.body.appendChild(div);
                }
                div.textContent = '[错误] Three.js 加载失败(本地+CDN均失败)，请检查部署完整性';
            });
        }
    </script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/models.js"></script>
    <script src="js/world.js"></script>
    <script src="js/effects.js"></script>
    <script src="js/squad.js"></script>
    <script src="js/gates.js"></script>
    <script src="js/enemies.js"></script>
    <script src="js/combat.js"></script>
    <!-- V3.4: 平台抽象层 + 广告系统(在game.js之前装配) -->
    <script src="js/platform/storage-adapter.js"></script>
    <script src="js/platform/lifecycle-adapter.js"></script>
    <script src="js/platform/audio-adapter.js"></script>
    <script src="js/platform/share-adapter.js"></script>
    <script src="js/platform/platform.js"></script>
    <script src="js/ads/ad-service.js"></script>
    <script src="js/ads/web-mock-ad.js"></script>
    <script src="js/ads/douyin-ad.js"></script>
    <script src="js/ads/wechat-ad.js"></script>
    <script src="js/ads/game-ad-coordinator.js"></script>
    <script>
        // V3.4: 广告服务引导装配(在Game实例化之前)
        Platform.initialize();
        window.__adService = setupAdService();
    </script>
    <script src="js/game.js"></script>
</body>
</html>
